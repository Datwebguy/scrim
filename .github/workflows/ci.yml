name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrim
          POSTGRES_PASSWORD: scrim
          POSTGRES_DB: scrim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scrim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://scrim:scrim@localhost:5432/scrim_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The local NEAR chain the tests run on (near-kit's sandbox) downloads its node once; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.near-kit
          key: near-sandbox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck
      - run: npm run unused
      - run: npm test
      - run: npm run build
